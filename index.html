<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>서명 전송하기</title>
    <style>
        /* 전체 화면을 흰색 배경으로 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 서명 영역 컨테이너 */
        .signature-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 250px;
            border: 2px dashed #cccccc;
            border-radius: 10px;
            background-color: transparent;
        }

        /* 배경에 투명하게 보일 "서명" 글씨 */
        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: rgba(0, 0, 0, 0.15); /* 연한 회색으로 투명한 느낌 제공 */
            pointer-events: none; /* 글씨가 터치 이벤트를 방해하지 않도록 설정 */
            user-select: none;
        }

        /* 실제 서명이 그려지는 캔버스 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 전송 및 지우기 버튼 스타일 */
        .btn-group {
            margin-top: 20px;
            width: 90%;
            max-width: 400px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #aaaaaa !important;
            cursor: not-allowed;
        }

        .btn-clear {
            background-color: #f0f0f0;
            color: #333;
        }

        .btn-submit {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="signature-container">
        <div class="bg-text" id="bg-text-element">서명</div>
        <canvas id="signature-canvas"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-clear" onclick="clearCanvas()">지우기</button>
        <button class="btn-submit" id="submit-btn" onclick="submitSignature()">전송</button>
    </div>

    <script>
        const canvas = document.getElementById('signature-canvas');
        const ctx = canvas.getContext('2d');
        const bgText = document.getElementById('bg-text-element');
        const submitBtn = document.getElementById('submit-btn');
        let isDrawing = false;
        let hasSigned = false; // 서명 여부 체크

        // 캔버스 크기를 고해상도로 설정 (모바일 대응)
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // 선 스타일 설정 (검은색 고정)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);

        // 그리기 시작 이벤트 (마우스 및 터치 대응)
        function startDrawing(e) {
            isDrawing = true;
            hasSigned = true;
            bgText.style.display = 'none'; // 서명을 시작하면 "서명" 배경 글씨 숨김
            draw(e);
        }

        // 그리기 종료
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // 실제 그리는 함수
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // 스크롤 방지

            const rect = canvas.getBoundingClientRect();
            // 터치 이벤트와 마우스 이벤트 좌표 처리
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 이벤트 리스너 등록
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // 화면 지우기 기능
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bgText.style.display = 'block'; // 배경 글씨 다시 표시
            hasSigned = false;
        }

        // 이메일 전송 기능
        function submitSignature() {
            if (!hasSigned || canvasIsEmpty()) {
                alert("서명란에 서명을 해주세요.");
                return;
            }

            // 버튼 중복 클릭 방지
            submitBtn.disabled = true;
            submitBtn.innerText = "전송 중...";

            // 캔버스 내용을 투명 배경의 PNG 이미지 데이터(Base64)로 변환
            const dataURL = canvas.toDataURL('image/png');
            
            // 외부 이메일 라우팅 서빙 레이어 API 활용 (Web3Forms 주소로 전송)
            const formData = new FormData();
            formData.append("access_key", "ea9d2258-ce70-4e72-9628-97b4dba9df1c"); // 이메일 포워딩용 가상 키
            formData.append("subject", "[알림] 웹사이트에서 새로운 서명이 제출되었습니다.");
            formData.append("from_name", "모바일 서명 시스템");
            formData.append("to_email", "gxy418@g-tem.net"); // 지정된 수신 이메일
            formData.append("message", "상대방이 전송한 서명 이미지 데이터입니다. 아래 링크 혹은 본문 이미지를 확인하세요.");
            
            // Base64 이미지를 텍스트 데이터 형식으로 첨부하여 이메일 본문 안에 포함
            formData.append("서명 이미지 첨부(DataURL)", dataURL);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    alert("서명이 수신 이메일(gxy418@g-tem.net)로 성공적으로 전송되었습니다!");
                    clearCanvas();
                } else {
                    alert("전송에 실패했습니다. 다시 시도해 주세요.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("네트워크 통신 오류가 발생했습니다.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "전송";
            });
        }

        // 캔버스가 완전히 비어있는지 체크하는 검증 함수
        function canvasIsEmpty() {
            const buffer = new Uint32Array(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
            return !buffer.some(color => color !== 0);
        }
    </script>
</body>
</html>
