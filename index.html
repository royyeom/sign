<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>서명 전송하기</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f9f9fc;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-form {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #333333;
        }

        .input-name {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            touch-action: auto !important;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .input-name:focus {
            border-color: #000000;
        }

        .signature-container {
            position: relative;
            width: 100%;
            height: 250px;
            border: 2px dashed #cccccc;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
            touch-action: none; 
        }

        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: rgba(0, 0, 0, 0.12);
            pointer-events: none;
            user-select: none;
            font-weight: bold;
            z-index: 0;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-color: transparent;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            touch-action: manipulation;
        }

        button:disabled {
            background-color: #cccccc !important;
            color: #ffffff !important;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-clear {
            background-color: #e5e5ea;
            color: #333333;
        }

        .btn-submit {
            background-color: #000000;
            color: #ffffff;
        }

        button:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="main-form">
        <div class="input-group">
            <label for="signer-name">서명자 이름</label>
            <input type="text" id="signer-name" class="input-name" placeholder="이름을 입력해 주세요." maxlength="10">
        </div>

        <div class="input-group" style="gap: 6px;">
            <label>서명 영역</label>
            <div class="signature-container">
                <div class="bg-text" id="bg-text-element">서명란</div>
                <canvas id="signature-canvas"></canvas>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-clear" onclick="clearCanvas()">지우기</button>
            <button class="btn-submit" id="submit-btn" onclick="submitSignature()">전송</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signature-canvas');
        const ctx = canvas.getContext('2d');
        const bgText = document.getElementById('bg-text-element');
        const submitBtn = document.getElementById('submit-btn');
        const nameInput = document.getElementById('signer-name');
        
        let isDrawing = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            if (hasSigned) {
                tempCtx.drawImage(canvas, 0, 0);
            }

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (hasSigned) {
                ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
            }
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            hasSigned = true;
            bgText.style.display = 'none';
            
            const pos = getEventPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();

            const pos = getEventPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bgText.style.display = 'block';
            hasSigned = false;
        }

        function dataURLtoBlob(dataURL) {
            const arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]), n = bstr.length;
            const u8arr = new Uint8Array(n);
            let i = n;
            while(i--) {
                u8arr[i] = bstr.charCodeAt(i);
            }
            return new Blob([u8arr], {type:mime});
        }

        function submitSignature() {
            const signerName = nameInput.value.trim();

            if (!signerName) {
                alert("서명하시는 분의 이름을 입력해 주세요.");
                nameInput.focus();
                return;
            }

            if (!hasSigned || canvasIsEmpty()) {
                alert("서명란에 서명을 해주세요.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "전송 중...";

            const dataURL = canvas.toToDataURL ? canvas.toDataURL('image/png') : canvas.toDataURL();
            const fileBlob = dataURLtoBlob(dataURL);
            
            const formData = new FormData();
            
            // ⚠️ [필수 확인] 여기에 새로 발급받으신 고유 Access Key를 입력하셔야 에러가 해결됩니다.
            formData.append("access_key", "ea9d2258-ce70-4e72-9628-97b4dba9df1c");
            
            formData.append("subject", `[서명 완료] ${signerName} 님의 서명이 도착했습니다.`);
            formData.append("from_name", "전자 서명 시스템");
            formData.append("message", `제출자 정보: ${signerName} 님\n\n요청하신 서명이 파일로 안전하게 첨부되었습니다.`);
            
            // 실제 파일 오브젝트 형식 명시 선언
            formData.append("attachment", fileBlob, `${signerName}_signature.png`);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                const resData = await response.json();
                if(response.ok && resData.success) {
                    alert(`${signerName} 님의 서명이 성공적으로 전송되었습니다!`);
                    nameInput.value = "";
                    clearCanvas();
                } else {
                    // 서버 에러 메시지 상세 출력 보안 장치
                    alert("서버 오류: " + (resData.message || "키가 유효하지 않거나 파일 첨부가 거부되었습니다. 새 키를 발급받아 주세요."));
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("네트워크 연결 상태 또는 브라우저 호환성을 확인해 주세요.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "전송";
            });
        }

        function canvasIsEmpty() {
            const buffer = new Uint32Array(ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer);
            return !buffer.some(color => color !== 0);
        }
    </script>
</body>
</html>
